# Builds the desktop app for macOS, Windows and Linux and publishes the installers as a GitHub release, which the
# installed apps (Windows and Linux) pick up as an update. Run it by bumping "version" in package.json and pushing a
# matching tag (git tag v1.2.0 && git push --tags).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
